[tox]
envlist=
    py312-django{51,52,60},
    py314-django{60,61},
;    docs,

[testenv]
deps =
    django-polymorphic >= 4.11
    django-mptt >= 0.9.0
    django51: Django ~= 5.1
    django52: Django ~= 5.2
    django60: Django ~= 6.0
    django61: Django ~= 6.1
;    django-dev: https://github.com/django/django/tarball/master
commands=
    python runtests.py

